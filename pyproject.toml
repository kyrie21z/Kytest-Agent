[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "code-agent-homework"
version = "1.0.0"
description = "Python test generation with tool execution and optional contract validation"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
authors = [{ name = "SE Homework" }]
keywords = ["agent", "llm", "pytest", "test-generation"]

[project.scripts]
code-agent = "code_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
code_agent = ["web/*.html", "web/data/*.json", "web/data/LICENSE"]
