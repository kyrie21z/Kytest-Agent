[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "code-agent-homework"
version = "1.0.0"
description = "一个零依赖、可扩展的代码助手 Agent（代码审查 / 解释 / 测试生成 / 重构建议）"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
authors = [{ name = "SE Homework" }]
keywords = ["agent", "llm", "code-review", "react", "homework"]

[project.scripts]
code-agent = "code_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
code_agent = ["web/*.html"]